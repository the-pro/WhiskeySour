[package]
name        = "whiskysour-core"
version.workspace = true
edition.workspace = true

[dependencies]
# HTML5 spec-compliant parser
html5ever    = "0.27"
markup5ever  = "0.12"

# Compact attribute storage (avoids heap alloc for ≤4 attrs)
smallvec     = { version = "1.13", features = ["union"] }

[dev-dependencies]
criterion    = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "parse"
harness = false

[[bench]]
name    = "find"
harness = false
